<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#164e63"/></marker>
    <style>.title{font:700 25px sans-serif}.label{font:18px sans-serif}.small{font:15px sans-serif}.dim{stroke:#164e63;stroke-width:3;marker-start:url(#arrow);marker-end:url(#arrow)}.guide{stroke:#64748b;stroke-width:2;stroke-dasharray:7 7}.rail{fill:#d1d5db;stroke:#475569;stroke-width:3}.table{fill:#d6b786;stroke:#6b4f2c;stroke-width:4}</style>
  </defs>
  <text x="40" y="42" class="title">P-frame measurement landmarks (schematic — not to scale)</text>
  <rect x="90" y="100" width="800" height="450" rx="4" class="table"/>
  <text x="105" y="130" class="label">tabletop top view</text>
  <rect x="240" y="220" width="560" height="50" class="rail"/>
  <rect x="240" y="375" width="560" height="50" class="rail"/>
  <rect x="210" y="195" width="50" height="255" class="rail"/>
  <text x="380" y="211" class="small">parallel 50 × 50 mm rails</text>
  <circle cx="700" cy="322" r="76" fill="#f8fafc" stroke="#111827" stroke-width="5"/>
  <circle cx="700" cy="322" r="10" fill="#dc2626"/>
  <text x="720" y="315" class="label">O_P candidate</text>
  <text x="720" y="339" class="small">centre of fixed lower rim / bolt pattern</text>
  <line x1="624" y1="180" x2="776" y2="180" class="dim"/>
  <line x1="624" y1="180" x2="624" y2="248" class="guide"/>
  <line x1="776" y1="180" x2="776" y2="248" class="guide"/>
  <text x="660" y="168" class="label">D_P</text>
  <line x1="170" y1="245" x2="170" y2="400" class="dim"/>
  <line x1="170" y1="245" x2="240" y2="245" class="guide"/>
  <line x1="170" y1="400" x2="240" y2="400" class="guide"/>
  <text x="30" y="330" class="label">d_rail_cc</text>
  <line x1="700" y1="322" x2="700" y2="100" class="dim"/>
  <text x="710" y="150" class="small">perpendicular distance to named long edge</text>
  <line x1="700" y1="322" x2="890" y2="322" class="dim"/>
  <text x="740" y="355" class="small">perpendicular distance to named short edge</text>
  <line x1="700" y1="322" x2="520" y2="322" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="510" y="307" class="label" fill="#dc2626">+x_P: along rails toward transverse member</text>
  <text x="90" y="590" class="small">Also measure h_table_P in a side-view photo. Confirm the selected circle is fixed; do not use an upper rotating joint cover.</text>
  <text x="90" y="618" class="small">Mark all endpoints directly on the returned photo/sketch. P ≠ B unless CAD/datum evidence resolves T_B_P.</text>
</svg>
