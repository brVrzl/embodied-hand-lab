task_name: grasp_and_hold
description: Grasp a target object and hold it without slip for a fixed dwell time.
required_sensors:
  - rgb
  - hand_states
  - arm_joint_states
success_condition: Object stays secured in hand for the full hold duration.
recommended_logging_fields:
  - hold_duration_sec
  - grasp_preset
  - slip_detected

