schema_version: quest_rh56_retarget.v1
selected_backend: adaptive

# Real Quest feature endpoints captured on 2026-07-30. This file calibrates
# human tracking features only; RH56 protocol travel is owned by
# configs/hand/rh56_pc_direct_teleop.yaml.
calibration:
  calibration_id: quest_rh56dfx_real_20260803_v3
  global_scale: 1.0
  palm_scale: 1.0
  finger_scale: [1.0, 1.0, 1.0, 1.0]
  finger_feature:
    # Medians of independently labelled stable-tail captures. The production
    # feature combines PIP/DIP curl with the configured MCP contribution.
    open: [0.051979, 0.055232, 0.035240, 0.089340]
    closed: [0.920303, 0.883532, 0.876213, 0.898434]
    curve_exponent: [1.0, 1.0, 1.0, 1.0]
  thumb_scale: 1.0
  key_vector_scale: 1.0
  thumb_curve:
    # Stable tails from the 2026-08-03 open, pregrasp, and lateral-only
    # captures stayed at or below 0.588 rad. The dedicated thumb-curve tail
    # reached 1.471 rad. This removes anatomical/resting bend from the live
    # curve while preserving a continuous range for real thumb flexion.
    curve_open_rad: 0.60
    curve_closed_rad: 1.47
  thumb_close:
    bend_gain: 1.0
    pinch_assist_gain: 0.4
  thumb_pinch_closed_distance_palm: 0.20
  thumb_pinch_open_distance_palm: 0.55
  thumb_lateral:
    # Across-palm is dot(thumb_tip-thumb_base, index-MCP->pinky-MCP) divided
    # by index-MCP/pinky-MCP span. Positive is increasing opposition.
    open_across_palm: -1.137268
    neutral_across_palm: -0.817716
    # Repeated hand-only HTS captures on 2026-08-03 placed the comfortable
    # straight-thumb pregrasp at a -0.339631 median. Map that pose to the
    # physically verified RH56 lateral 0.90 while preserving the original
    # fully opposed endpoint and a continuous monotonic response.
    pregrasp_across_palm: -0.339631
    pregrasp_normalized: 0.90
    opposed_across_palm: 0.060326
    frame_epsilon_m: 0.00001
  pinch_intent:
    # Labelled index/middle contacts measured 0.051/0.102 palm lengths. Entry
    # is deliberately tighter than exit; tripod additionally requires the
    # index and middle tips to be mutually close.
    enter_distance_palm: 0.15
    exit_distance_palm: 0.22
    tripod_enter_distance_palm: 0.22
    tripod_exit_distance_palm: 0.30
    minimum_finger_curl: 0.12
    power_grasp_curl: 0.70
  pinch_pose_blending:
    # The staged thumb-first probe confirmed index/thumb fingertip contact at
    # approximately index .55, thumb-close .40, lateral .90. Keep the
    # simultaneous blend disabled: live output must enter through the staged
    # gate below so index cannot block opposition.
    enabled: false
    maximum_weight_step: 0.05
    validated_poses:
      index: [0.55, 0.0, 0.0, 0.0, 0.40, 0.90]
  thumb_first_pinch:
    # Canonical order is index, middle, ring, pinky, thumb_close,
    # thumb_lateral. The gate below is intentionally narrow: ordinary index
    # pinch approach passes through; guards apply only when the verified
    # contact neighborhood is requested but measured lateral opposition is
    # still blocked.
    enabled: true
    lateral_target: 0.90
    lateral_tolerance: 0.04
    # Diagnostic activation is limited to the verified [index=.55,
    # thumb_close=.40, lateral=.90] contact neighborhood. All targets are
    # passed through unchanged; no preposition/guard pose is used.
    index_activation: 0.50
    thumb_close_activation: 0.35
    lateral_activation: 0.86
  mcp_flexion_weight: 0.15
  mcp_flexion_deadband: 0.15
  maximum_normalized_step: 0.08
  loss_behavior: hold

model_contract:
  canonical_order: [index, middle, ring, pinky, thumb_close, thumb_lateral]
  mujoco_actuator_order: [thumb_lateral, thumb_close, index, middle, ring, pinky]
  full_joint_count: 12
  independent_actuator_count: 6
  mimic_semantics: project_mujoco_equality_constraints
