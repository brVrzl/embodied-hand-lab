mode: real
device_name: inspire_rh56
transport: serial_rs485_pc_direct
backend_type: serial_protocol
serial:
  # The operator must override this with the adapter's real stable by-id path.
  port: /dev/serial/by-id/REPLACE_WITH_ACTUAL_RH56_ADAPTER_ID
  baudrate: 115200
  timeout_sec: 0.2
  hand_id: 1
finger_count: 6
control_frequency_hz: 40
scheduler_profile: fast40
scheduler_profiles:
  baseline:
    command_rate_hz: 15
    angle_feedback_rate_hz: 15
    current_feedback_rate_hz: 15
    force_feedback_rate_hz: 15
    status_feedback_rate_hz: 15
    error_feedback_rate_hz: 15
  fast30:
    command_rate_hz: 30
    angle_feedback_rate_hz: 15
    current_feedback_rate_hz: 10
    force_feedback_rate_hz: 10
    status_feedback_rate_hz: 10
    error_feedback_rate_hz: 10
  fast40:
    command_rate_hz: 40
    angle_feedback_rate_hz: 15
    current_feedback_rate_hz: 10
    force_feedback_rate_hz: 10
    status_feedback_rate_hz: 10
    error_feedback_rate_hz: 10
  fast50:
    command_rate_hz: 50
    angle_feedback_rate_hz: 15
    current_feedback_rate_hz: 10
    force_feedback_rate_hz: 10
    status_feedback_rate_hz: 10
    error_feedback_rate_hz: 10
serial_inter_transaction_delay_ms: 5
feedback_warning_age_ms:
  angle: 150
  current: 250
  force: 250
  status: 250
  error: 250
# Gate policy: two configured 0.2 s serial timeouts without fresh feedback.
feedback_stale_timeout_sec: 0.4
diagnostics:
  # Timing windows and per-register latency fields are opt-in and bounded.
  enabled: true
  window_size: 256
  exact_duplicate_suppression: true
  # No stale target is dropped unless a later hand-only experiment explicitly
  # enables this mechanism. Measured activation targets are always exempt.
  stale_command_drop_enabled: false
  stale_command_max_age_sec: 0.25
  telemetry_buffer_capacity: 64
  telemetry_flush_every_records: 16
  telemetry_flush_interval_sec: 1.0
close_strength: 0.35
pinch_strength: 0.25
speed_default: [800, 800, 800, 800, 800, 800]
force_default: [260, 260, 260, 260, 260, 260]
hand_schema:
  version: inspire6_v1
  canonical_order: [index, middle, ring, pinky, thumb_close, thumb_lateral]
  canonical_hand_order: [index, middle, ring, pinky, thumb_close, thumb_lateral]
  protocol_order: [pinky, ring, middle, index, thumb_close, thumb_lateral]
  gesture_order: canonical
  raw_order: [thumb_close, thumb_lateral, index, middle, ring, pinky]
  hand_delta_limit: 0.05
  dof_calibration:
    index: {raw_open: 1000, raw_close: 0, direction_sign: -1, safe_min: 0, safe_max: 1000, default_speed: 800, default_force_limit: 260}
    middle: {raw_open: 1000, raw_close: 0, direction_sign: -1, safe_min: 0, safe_max: 1000, default_speed: 800, default_force_limit: 260}
    ring: {raw_open: 1000, raw_close: 0, direction_sign: -1, safe_min: 0, safe_max: 1000, default_speed: 800, default_force_limit: 260}
    pinky: {raw_open: 1000, raw_close: 0, direction_sign: -1, safe_min: 0, safe_max: 1000, default_speed: 800, default_force_limit: 260}
    thumb_close: {raw_open: 1000, raw_close: 0, direction_sign: -1, safe_min: 0, safe_max: 1000, default_speed: 800, default_force_limit: 260}
    thumb_lateral: {raw_open: 1000, raw_close: 0, direction_sign: -1, safe_min: 0, safe_max: 1000, default_speed: 800, default_force_limit: 260}
gesture_presets:
  open: [1000, 1000, 1000, 1000, 1000, 1000]
  close: [200, 200, 200, 200, 200, 200]
  pinch: [650, 650, 760, 760, 500, 350]
topics:
  state: /hand/state
  command: /hand/command
safety:
  estop_enabled: true
  max_close_strength: 0.8
  teleop_notes:
    - This config is for RH56 PC-direct hand-only teleop.
    - Fast40 is the physically selected default; baseline/fast30/fast50 remain explicit comparison profiles. Delta_limit remains 0.05 and this gate performs no automatic config writes.
    - No PC-direct low-pass filter is configured.
    - /hand/command_angles expects canonical raw count order.
