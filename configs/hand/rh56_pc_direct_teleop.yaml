serial:
  baudrate: 115200
  timeout_sec: 0.2
  hand_id: 1
scheduler:
  command_rate_hz: 40
  angle_feedback_rate_hz: 15
  current_feedback_rate_hz: 10
  force_feedback_rate_hz: 10
  status_feedback_rate_hz: 10
  error_feedback_rate_hz: 10
serial_inter_transaction_delay_ms: 5
feedback_warning_age_ms:
  angle: 150
  current: 250
  force: 250
  status: 250
  error: 250
# Gate policy: two configured 0.2 s serial timeouts without fresh feedback.
feedback_stale_timeout_sec: 0.4
diagnostics:
  # Timing windows and per-register latency fields are opt-in and bounded.
  enabled: true
  window_size: 256
  exact_duplicate_suppression: true
  # No stale target is dropped unless a later hand-only experiment explicitly
  # enables this mechanism. Measured activation targets are always exempt.
  stale_command_drop_enabled: false
  stale_command_max_age_sec: 0.25
  telemetry_buffer_capacity: 64
  telemetry_flush_every_records: 16
  telemetry_flush_interval_sec: 1.0
# Software-only normalized position shaping.  This limits command velocity and
# acceleration at the 40 Hz hand boundary; it does not write RH56 registers or
# bypass the delta/contact/fault gates below.
command_shaping:
  enabled: true
  maximum_closing_velocity: [0.35, 0.35, 0.35, 0.35, 0.35, 0.35]
  # Opening is intentionally bounded separately because direct measurements
  # showed abrupt four-times-faster release steps than closure steps.
  maximum_opening_velocity: [0.60, 0.60, 0.60, 0.60, 0.60, 0.60]
  maximum_acceleration: [1.40, 1.40, 1.40, 1.40, 1.40, 1.40]
hand_schema:
  version: inspire6_v1
  protocol_order: [pinky, ring, middle, index, thumb_close, thumb_lateral]
  gesture_order: canonical
  hand_delta_limit: 0.05
  dof_calibration:
    index: {raw_open: 1000, raw_close: 0, direction_sign: -1, safe_min: 0, safe_max: 1000, default_speed: 800, default_force_limit: 260}
    middle: {raw_open: 1000, raw_close: 0, direction_sign: -1, safe_min: 0, safe_max: 1000, default_speed: 800, default_force_limit: 260}
    ring: {raw_open: 1000, raw_close: 0, direction_sign: -1, safe_min: 0, safe_max: 1000, default_speed: 800, default_force_limit: 260}
    pinky: {raw_open: 1000, raw_close: 0, direction_sign: -1, safe_min: 0, safe_max: 1000, default_speed: 800, default_force_limit: 260}
    thumb_close: {raw_open: 1000, raw_close: 0, direction_sign: -1, safe_min: 0, safe_max: 1000, default_speed: 800, default_force_limit: 260}
    thumb_lateral: {raw_open: 1000, raw_close: 0, direction_sign: -1, safe_min: 0, safe_max: 1000, default_speed: 800, default_force_limit: 260}
gesture_presets:
  open: [1000, 1000, 1000, 1000, 1000, 1000]
  close: [200, 200, 200, 200, 200, 200]
  pinch: [650, 650, 760, 760, 500, 350]
safety:
  # The RH56 normalized protocol domain is available on every channel. Object
  # protection is handled by the feedback-qualified contact stop below, not by
  # a fixed 0.8 travel truncation.
  max_close_strength: 1.0
  contact_stop:
    enabled: true
    require_fresh_force_before_closure_step: true
    # Preserve the prior worst-case 0.05 closure between FORCE samples, but
    # distribute it across four 40 Hz writes instead of one visible 10 Hz jump.
    closure_budget_per_force_sample: 0.05
    maximum_closure_step: 0.0125
    # FORCE_ACT must move this far from the activation/no-contact baseline.
    force_delta_onset: [400, 400, 400, 400, 400, 400]
    force_delta_release: [150, 150, 150, 150, 150, 150]
    # A force event is only a contact candidate while closure is still
    # requested and fresh ANGLE_ACT progress has stalled. The first sample
    # pauses closure provisionally; the second consecutive sample latches.
    minimum_closing_gap: 0.008
    maximum_stall_progress: 0.005
    consecutive_samples: 2
    relief_margin: 0.01
    release_open_delta: 0.02
    baseline_alpha: 0.10
  teleop_notes:
    - This config is for RH56 PC-direct hand-only teleop.
    - The fixed scheduler uses 40 Hz commands, 15 Hz ANGLE feedback, and 10 Hz CURRENT/FORCE/STATUS/ERROR feedback. Delta_limit remains 0.05 and this gate performs no automatic config writes.
    - Command shaping is a normalized position trajectory limit, not a low-pass filter; the latest-only target and 40 Hz scheduler remain unchanged.
    - /hand/command_angles expects canonical raw count order.
