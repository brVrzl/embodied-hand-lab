mode: mock
device_name: inspire_rh56
transport: serial_rs485
backend_type: mock
serial:
  port: /dev/ttyUSB0
  baudrate: 115200
  timeout_sec: 0.2
  hand_id: 1
jaka_tool_rs485:
  robot_config_path: configs/robot/jaka_mini2.yaml
  channel_id: 1
  hand_id: 1
  command_pause_sec: 0.8
  prepare_tio:
    enable_vout: false
    vout_enable: 1
    vout_vol: 0
    set_ai_pin_mode: false
    ai_pin_mode: 1
    set_channel_mode: false
    channel_mode: 1
    set_comm: false
    comm:
      chn_id: 1
      slave_id: 1
      baudrate: 115200
      databit: 8
      stopbit: 1
      parity: 78
ros2_services:
  namespace: /inspire_hand
  set_angle: /inspire_hand/set_angle
  set_pos: /inspire_hand/set_pos
  set_force: /inspire_hand/set_force
  set_speed: /inspire_hand/set_speed
  set_gesture_no: /inspire_hand/set_gesture_no
  get_angle_act: /inspire_hand/get_angle_act
  get_pos_act: /inspire_hand/get_pos_act
  get_force_act: /inspire_hand/get_force_act
  get_current_act: /inspire_hand/get_current_act
  get_error: /inspire_hand/get_error
  get_temp: /inspire_hand/get_temp
finger_count: 6
control_frequency_hz: 5
close_strength: 0.6
pinch_strength: 0.4
speed_default: [800, 800, 800, 800, 800, 800]
force_default: [500, 500, 500, 500, 500, 500]
hand_schema:
  version: inspire6_v1
  canonical_order: [index, middle, ring, pinky, thumb_close, thumb_lateral]
  canonical_hand_order: [index, middle, ring, pinky, thumb_close, thumb_lateral]
  protocol_order: [pinky, ring, middle, index, thumb_close, thumb_lateral]
  gesture_order: canonical
  raw_order: [thumb_close, thumb_lateral, index, middle, ring, pinky]
  hand_delta_limit: 0.05
  dof_calibration:
    index: {raw_open: 1000, raw_close: 0, direction_sign: -1, safe_min: 0, safe_max: 1000, default_speed: 800, default_force_limit: 500}
    middle: {raw_open: 1000, raw_close: 0, direction_sign: -1, safe_min: 0, safe_max: 1000, default_speed: 800, default_force_limit: 500}
    ring: {raw_open: 1000, raw_close: 0, direction_sign: -1, safe_min: 0, safe_max: 1000, default_speed: 800, default_force_limit: 500}
    pinky: {raw_open: 1000, raw_close: 0, direction_sign: -1, safe_min: 0, safe_max: 1000, default_speed: 800, default_force_limit: 500}
    thumb_close: {raw_open: 1000, raw_close: 0, direction_sign: -1, safe_min: 0, safe_max: 1000, default_speed: 800, default_force_limit: 500}
    thumb_lateral: {raw_open: 1000, raw_close: 0, direction_sign: -1, safe_min: 0, safe_max: 1000, default_speed: 800, default_force_limit: 500}
gesture_presets:
  open: [1000, 1000, 1000, 1000, 1000, 1000]
  close: [0, 0, 0, 0, 0, 0]
  pinch: [400, 400, 500, 200, 200, 500]
  power_grasp: [150, 150, 200, 200, 200, 450]
  tripod: [250, 250, 250, 200, 200, 500]
  lateral: [500, 500, 500, 250, 250, 650]
topics:
  state: /hand/state
  command: /hand/command
services:
  execute_grasp: /hand/execute_grasp
  get_state: /hand/get_state
safety:
  estop_enabled: true
  max_close_strength: 0.85
