hebi:
  family: HEBI
  name: mobileIO
  lookup_wait_sec: 5.0
  setup_ui: true
  max_stale_feedback_sec: 0.35
  publish_hz: 40.0
  read_timeout_ms: 20.0

topics:
  arm_palm_target_jog: /jaka/teleop_palm_target_jog
  hand_command_code: /rh56/command_code
  shadow_joint_states: /teleop/shadow_joint_states
  shadow_status: /teleop/shadow_status
  hebi_pose: /teleop/hebi_mobile_io/pose
  shadow_palm_target: /teleop/shadow_palm_target

direction_calibration:
  phone_to_robot:
    x: {source: y, sign: 1.0, scale: 1.0}
    y: {source: x, sign: -1.0, scale: 1.0}
    z: {source: z, sign: 1.0, scale: 1.0}
  wrist_roll:
    source: rot_z
    sign: -1.0
    scale: 1.0

relative_pose_lag_follow:
  target_response_mode: direct
  position_scale: 0.35
  max_step_position_m: 0.020
  max_step_rotation_deg: 2.0
  max_target_lead_m: 0.18
  workspace_min_m: [-0.22, 0.25, 0.10]
  workspace_max_m: [0.22, 0.62, 0.40]
  max_pos_tracking_error_warn_m: 0.080
  max_pos_tracking_error_pause_m: 0.160
  max_q_tracking_error_pause_rad: 0.50
  min_warn_time_scale: 0.50
  phone_translation_deadband_m: 0.001
  phone_rotation_deadband_deg: 1.0
  phone_jump_reject_translation_m: 0.35
  phone_jump_reject_rotation_deg: 60.0
  phone_still_translation_m: 0.001
  phone_still_rotation_deg: 0.5
  phone_still_min_sec: 0.0
  phone_still_freeze_tracking_error_m: 0.0
  freeze_when_phone_still: false
  target_filter_time_constant_sec: 0.040
  max_target_velocity_m_s: 0.800
  max_target_acceleration_m_s2: 6.000
  max_target_jump_m: 0.180
  target_update_deadband_m: 0.0002
  target_update_release_m: 0.0004
  reanchor_requires_deadman_release: true

shadow:
  mjcf_path: data/sim_assets/jaka_rh56.xml
  initial_arm_joints_rad: [-1.5707963268, -0.6108652382, -1.5707963268, 0.1745329252, 0.6108652382, -0.2617993878]
  ik_gain: 0.7
  ik_damping: 0.05
  ik_max_step_rad: 0.08
  ik_iterations: 20
  target_workspace_radius_m: 0.08
