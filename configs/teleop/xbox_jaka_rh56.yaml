input:
  gamepad_index: 0
  deadzone: 0.12
  velocity_filter_time_constant_sec: 0.08
publish_hz: 50.0
precision_scale: 0.25
direction_calibration:
  # Mature ROS joystick teleop convention: keep enable/deadman separate from
  # axis/scale mapping, so direction fixes are YAML-only.
  translation:
    x: {source: left_x, sign: -1.0, scale: 1.0}
    y: {source: left_y, sign: 1.0, scale: 1.0}
    z: {source: right_y, sign: -1.0, scale: 1.0}
  wrist_roll: {source: right_x, sign: 1.0, scale: 1.0}
shadow:
  initial_arm_joints_rad: [-1.57079632679, -0.75, 1.10, 0.0, -0.35, 0.0]
  mjcf_path: data/sim_assets/jaka_rh56.xml
  max_translation_velocity_m_s: 0.10
  max_wrist_roll_velocity_rad_s: 0.6
  ik_gain: 0.65
  ik_damping: 0.05
  ik_max_step_rad: 0.025
  ik_iterations: 4
  target_workspace_radius_m: 0.0
topics:
  arm_palm_target_jog: /jaka/teleop_palm_target_jog
  rh56_command_code: /rh56/command_code
  status: /teleop/xbox_status
