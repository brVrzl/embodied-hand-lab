schema_version: embodied_lab.mujoco_joint_reach_preshape.v1
benchmark_id: jaka_rh56_offline_joint_reach_preshape_smoke
seed: 20260731

simulation:
  # This profile has no workspace object scene. The benchmark tests only the
  # MuJoCo arm plant and six actuator-driven RH56 joints.
  replay_config_path: configs/sim/quest_hts_jaka_mini2_offline.yaml

task:
  type: mujoco_joint_reach_preshape_smoke
  duration_s: 2.0
  control_period_s: 0.008
  arm:
    target_offset_rad: [0.020, -0.015, 0.010, 0.015, -0.010, 0.010]
    # Seeded bounded jitter proves reset/repeatability without pretending to
    # provide broad domain randomization.
    target_jitter_rad: [0.002, 0.002, 0.002, 0.002, 0.002, 0.002]
    success_tolerance_rad: 0.001
  hand:
    # These are simulated actuator/joint radians, not RH56 raw ANGLE_ACT counts
    # and not all coupled passive-joint angles.
    target_rad:
      thumb_lateral: 0.10
      thumb_close: 0.10
      index: 0.20
      middle: 0.20
      ring: 0.20
      pinky: 0.20
    success_tolerance_rad: 0.002
