dataset:
  root: data/episodes
  fps: 30
  # Canonical selection is causal. Two 30 Hz frame periods plus a small margin
  # tolerate ordinary host receive jitter; longer stalls still abort capture.
  camera_max_age_ms: 70.0
  control_max_age_ms: 20.0
  hand_start_tolerance_rad: 0.05

# Copy this example to a local ignored file and fill both serials from
# `python tools/check_realsense_stream.py --list-devices`. Roles must never be
# inferred from /dev/video* ordering.
cameras:
  workspace:
    serial: REPLACE_WITH_WORKSPACE_D435_SERIAL
    width: 640
    height: 480
    fps: 30
    visual_preset: default
    allow_profile_fallback: true
    align_depth_to_color: true
    warmup_frames: 5
    timeout_ms: 5000
    max_timestamp_skew_ms: 33.333334
    sync_retry_frames: 30
    filters:
      use_disparity: true
      spatial: {enabled: true, magnitude: 2, smooth_alpha: 0.5, smooth_delta: 20, hole_fill: 0}
      temporal: {enabled: false}
      hole_filling: {enabled: false}
  wrist:
    serial: REPLACE_WITH_WRIST_D435_SERIAL
    width: 640
    height: 480
    fps: 30
    visual_preset: default
    allow_profile_fallback: true
    align_depth_to_color: true
    warmup_frames: 5
    timeout_ms: 5000
    max_timestamp_skew_ms: 33.333334
    sync_retry_frames: 30
    filters:
      use_disparity: true
      spatial: {enabled: true, magnitude: 2, smooth_alpha: 0.5, smooth_delta: 20, hole_fill: 0}
      temporal: {enabled: false}
      hole_filling: {enabled: false}

calibration:
  snapshot_files: []
