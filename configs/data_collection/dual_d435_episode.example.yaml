dataset:
  root: data/episodes
  fps: 30
  camera_max_age_ms: 33.333334
  control_max_age_ms: 20.0
  hand_start_tolerance_rad: 0.05

# Copy this example to a local ignored file and fill both serials from
# `python tools/check_realsense_stream.py --list-devices`. Roles must never be
# inferred from /dev/video* ordering.
cameras:
  workspace:
    serial: REPLACE_WITH_WORKSPACE_D435_SERIAL
    width: 640
    height: 480
    fps: 30
    allow_profile_fallback: true
    align_depth_to_color: true
    warmup_frames: 5
    timeout_ms: 5000
    max_timestamp_skew_ms: 33.333334
    sync_retry_frames: 30
    filters:
      use_disparity: false
      spatial: {enabled: false}
      temporal: {enabled: false}
      hole_filling: {enabled: false}
  wrist:
    serial: REPLACE_WITH_WRIST_D435_SERIAL
    width: 640
    height: 480
    fps: 30
    allow_profile_fallback: true
    align_depth_to_color: true
    warmup_frames: 5
    timeout_ms: 5000
    max_timestamp_skew_ms: 33.333334
    sync_retry_frames: 30
    filters:
      use_disparity: false
      spatial: {enabled: false}
      temporal: {enabled: false}
      hole_filling: {enabled: false}

calibration:
  snapshot_files: []

sources:
  quest_raw: available
  accepted_arm_target: available
  emitted_arm_command_125hz: available
  arm_q: measured
  arm_dq: estimated_from_causal_measured_q
  tcp_pose: estimated_from_measured_q_fk
  hand_target: commanded
  hand_observation: unavailable_until_feedback_is_integrated
