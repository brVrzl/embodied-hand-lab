schema_version: embodied_lab.force_information_experiment.v1

cohort:
  label: MIXED_QUALITY_V2_DIAGNOSTIC
  interpretation: >-
    The 25 logical trajectories are a mixed-quality historical materialization,
    not 25 clean expert demonstrations and not the final nominal16 comparison
    cohort. Timestamp and raw-signal analyses remain useful; policy claims do not.

# This experiment reads only the reviewed, derived master. Raw episodes and
# the master itself remain immutable.
dataset:
  master: data/training/physical_bottle_v2/act/master
  source_metadata_root: data/raw_episodes/meta/episodes/chunk-000
  materialization_manifest: data/training/physical_bottle_v2/materialization.json
  expected_materialization_fingerprint: 1b8361623e772c196fed9c975bb056cbce81817db26f6055c3d5239d5b050572

probe:
  # Median centering over the first unique updates removes an episode offset.
  # It is not a no-contact baseline or a semantic phase label.
  initial_center_updates: 10
  # These count actual unique FORCE_ACT sources, not zero-order-held 30 Hz rows.
  # At the observed ~10 Hz polling rate they span approximately 0.2, 0.5, and
  # 1.0 s; the result records the actual timestamp span for every candidate.
  history_updates: [3, 6, 11]
  future_horizon_updates: 2
  large_change_quantile: 0.8
  ridge_l2: 10.0
  logistic_l2: 10.0
