schema_version: embodied_lab.icra2027_bottle_rgb_annotation.v1
annotation_id: replace-with-unique-annotation-id

dataset_identity:
  logical_dataset_id: replace-with-logical-dataset-id
  source_dataset_id: replace-with-source-dataset-id
  session_id: replace-with-capture-session-id
  logical_episode_id: replace-with-logical-episode-id
  source_episode_id: episode_000000
  dataset_fingerprint:
    algorithm: sha256
    digest: REPLACE_WITH_64_LOWERCASE_HEX_SHA256
    scope: replace-with-the-exact-inventory-and-configuration-covered-by-this-digest

canonical_timeline:
  timestamp_field: timestamp_ns
  timestamp_domain: host_monotonic_ns
  frame_index_field: frame_index
  frame_index_origin: 0
  interval_semantics: inclusive_uncertainty_bounds
  primary_view_id: workspace

evidence_views:
  - view_id: workspace
    feature_key: observation.images.workspace
    source_path: videos/observation.images.workspace/chunk-000/episode_000000.mp4
    availability: available
    media_sha256: REPLACE_WITH_64_LOWERCASE_HEX_SHA256
    canonical_frame_count: 1
    notes: replace hash and frame count before annotation
  - view_id: wrist
    feature_key: observation.images.wrist
    source_path: videos/observation.images.wrist/chunk-000/episode_000000.mp4
    availability: available
    media_sha256: REPLACE_WITH_64_LOWERCASE_HEX_SHA256
    canonical_frame_count: 1
    notes: replace hash and frame count before annotation

blinding:
  mode: rgb_only
  force_act_hidden: true
  rh56_position_hidden: true
  jaka_state_hidden: true
  action_targets_hidden: true
  hand_grip_hidden: true
  action_status_hidden: true
  contact_clamp_hidden: true
  labels_locked_before_signal_access: true
  label_lock_id: replace-after-rgb-label-lock

reviewer:
  reviewer_id: replace-with-pseudonymous-reviewer-id
  annotation_round: primary
  annotated_at_utc: REPLACE_WITH_ISO8601_UTC
  protocol_version: icra2027_bottle_rgb_annotation.v1
  notes: replace template values before treating this record as an annotation

events:
  closure_onset:
    status: unobservable
    confidence: low
    evidence_view_ids: []
    notes: replace after RGB-only review
  visible_interaction_onset:
    status: unobservable
    confidence: low
    evidence_view_ids: []
    notes: optional; retain unobservable when direct interaction is occluded
  lift_off:
    status: unobservable
    confidence: low
    evidence_view_ids: []
    notes: replace after RGB-only review
  placement_contact:
    status: unobservable
    confidence: low
    evidence_view_ids: []
    notes: replace after RGB-only review
  release_onset:
    status: unobservable
    confidence: low
    evidence_view_ids: []
    notes: replace after RGB-only review
  object_supported_after_release:
    status: unobservable
    confidence: low
    evidence_view_ids: []
    notes: replace after RGB-only review

milestones:
  approach:
    outcome: unobservable
    confidence: low
    evidence_view_ids: []
    notes: replace after RGB-only review
  grasp:
    outcome: unobservable
    confidence: low
    evidence_view_ids: []
    notes: replace after RGB-only review
  lift:
    outcome: unobservable
    confidence: low
    evidence_view_ids: []
    notes: replace after RGB-only review
  transport:
    outcome: unobservable
    confidence: low
    evidence_view_ids: []
    notes: replace after RGB-only review
  place:
    outcome: unobservable
    confidence: low
    evidence_view_ids: []
    notes: replace after RGB-only review
  release:
    outcome: unobservable
    confidence: low
    evidence_view_ids: []
    notes: replace after RGB-only review

task_outcome:
  label: indeterminate
  confidence: low
  evidence_view_ids: []
  notes: replace after RGB-only review

failure:
  stage: null
  evidence_source: not_assigned
  confidence: low
  evidence_view_ids: []
  notes: do not assign a stage without the evidence required by the protocol

control_termination:
  status: unknown
  evidence_source: unknown
  reason: null
  confidence: low
  notes: populate separately after the RGB labels are locked

visible_slip:
  status: unobservable
  direct_rgb_evidence: false
  confidence: low
  evidence_view_ids: []
  notes: observed is allowed only with direct RGB evidence

notes: replace all template values; keep the filled record in ignored derived outputs
