schema_version: embodied_lab.physical_bottle_collection_config.v1
name: physical_bottle_nominal52
source_root: ../../data/raw_episodes
output_root: ../../data/training/physical_bottle_v4_nominal52
audit_report: ../../../docs/data/DATASET.md
materialization_report: ../../../docs/data/DATASET.md
task:
  id: place_bottle_on_cardboard_box
  prompt: Pick up the bottle and place it on the cardboard box.
fps: 30
action_horizon: 16

# The single active task configuration also owns the policy-facing views and
# the locked LeRobot episode split. Existing generated dataset roots retain
# their v4 identifier for provenance and are not renamed here.
training:
  validation_source_episodes: [87, 88, 108, 109, 138, 139, 140, 141, 142, 172, 173, 174]
  expected:
    train_trajectories: 37
    validation_trajectories: 15
    train_rows: 23802
    validation_rows: 9309
views:
  act:
    dataset_root: ../../data/training/physical_bottle_v4_nominal52/act
    view: act
    split: train
    action_horizon: 16
    short_horizon_policy: repeat_last_with_mask
    action_semantics: absolute_native_target
    observation:
      images: [workspace, wrist]
      state: observation.state
      force: ignored
    normalization:
      state: ../../data/training/physical_bottle_v4_nominal52/stats/state_stats.json
      action: ../../data/training/physical_bottle_v4_nominal52/stats/action_stats.json
  act_force:
    dataset_root: ../../data/training/physical_bottle_v4_nominal52/act_force
    view: act_force
    split: train
    action_horizon: 16
    short_horizon_policy: repeat_last_with_mask
    action_semantics: absolute_native_target
    observation:
      images: [workspace, wrist]
      state: observation.state
      force: observation.force
      force_age: force_age_s
      force_valid: force_valid
    normalization:
      state: ../../data/training/physical_bottle_v4_nominal52/stats/state_stats.json
      action: ../../data/training/physical_bottle_v4_nominal52/stats/action_stats.json
      force: ../../data/training/physical_bottle_v4_nominal52/stats/force_stats.json

