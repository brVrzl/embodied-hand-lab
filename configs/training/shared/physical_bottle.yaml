audit_provenance:
  authority: human_operator_plus_offline_boundary_review
  date: "2026-08-13"
  statement: Operator workspace-video audit, followed by offline synchronized row and task-boundary review.
audit_notes:
  - The nominal16 source decisions and corrected 99/102 segmentation are preserved unchanged.
  - Episodes 122-129 and 132 are excluded by the operator audit; episode 130 has partial metadata but no complete training payload.
  - Episodes 135 and 136 remain review-required because a person is visible during the actual task interval, so tail cropping cannot remove that visual nuisance without deleting task behavior.
  - New nominal tasks retain complete approach, grasp, lift/transport, place, release, and final robot motion, while excluding pre-task hold and post-task stationary/manual-reset intervals.
  - Raw rows and videos are never rewritten; every included row keeps its source episode, frame, and timestamp provenance.
  - Episodes 150-180 were added from the 2026-08-13 operator audit. 153 is retained in the source audit because files exist locally, but is excluded because the operator reported it missing.
  - Episodes 163-165, 167-171, and 175-180 are excluded as operator-marked unusable. Episode 161 is included per the operator's "all other episodes normal" instruction; its raw metadata warning is preserved.
  - Source 172 is represented by three included logical tasks (172_a, 172_b, 172_c); source 174 by two included tasks (174_a, 174_b) and one excluded incomplete task. Reset/manual-recovery gaps are excluded from every logical segment.
  - New standalone tasks retain their complete approach through release while removing initial hold and post-task stationary/manual-reset tails. No raw rows or videos are rewritten.

