schema_version: embodied_lab.openpi_view_config.v1
dataset_root: ../../data/training/physical_bottle_v1
view: openpi
split: train
action_horizon: 16
action_semantics: absolute_native_target
force_enabled: false
task_prompt: Pick up the bottle and place it on the cardboard box.
openpi:
  package: openpi
  status: skeleton_only_package_not_installed
  image_keys:
    workspace: observation.images.workspace
    wrist: observation.images.wrist
  state_key: observation.state
  action_key: action
  task_key: task
  normalization_stats: stats/openpi_stats.json
