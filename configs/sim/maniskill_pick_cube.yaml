env:
  env_id: PickCube-v1
  obs_mode: rgbd
  control_mode: pd_ee_delta_pose
  render_mode: null
  num_envs: 1
  camera_uid: base_camera
  flatten_rgbd_obs: false
  sensor_configs:
    width: 128
    height: 128

task:
  task_name: pick_and_place
  instruction: pick the cube and place it at the goal region
  operator: sim_maniskill_random

robot:
  arm_joint_count: 7
  hand_joint_count: 2

recording:
  episodes: 1
  max_steps: 50
  seed: 0
  policy: random
  output_dir: data/episodes/maniskill_pick_cube
  export_dir: data/exports/structured/maniskill_pick_cube

logging:
  logging_config: configs/logging/default.yaml
