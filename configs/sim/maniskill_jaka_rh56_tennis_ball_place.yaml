env:
  env_id: TennisBallPlaceJakaRH56-v1
  env_module: sim_maniskill.tasks.pick_cube_jaka_rh56
  agent_module: sim_maniskill.agents.jaka_rh56
  obs_mode: rgbd
  control_mode: pd_joint_delta_pos
  render_mode: null
  num_envs: 1
  camera_uid: base_camera
  sensor_configs:
    width: 256
    height: 256
  env_kwargs:
    robot_uids: jaka_rh56
    robot_init_qpos_noise: 0.0
    start_pose: pregrasp
    sensor_camera_preset: default
    goal_xy: [-0.02, 0.16]

task:
  task_name: tennis_ball_place_fixed_goal
  instruction: pick up the tennis ball and place it on the blue target
  operator: sim_digital_twin
  object_id: tennis_ball_67mm
  object_pose_init: fixture_A_randomized_4cm
  target_id: tabletop_goal_blue_disc

robot:
  embodiment: jaka_mini2_rh56_single_arm
  arm_joint_count: 6
  hand_joint_count: 6
  canonical_hand_order: [index, middle, ring, pinky, thumb_close, thumb_lateral]
  action_schema:
    continuous_baseline: [ee_delta_6, hand_target_norm_6]
    annotated_main: [ee_delta_6, hand_code_id, close_strength]
    hand_norm_semantics: 0_open_1_close
    raw_semantics: rh56_vendor_count_1000_open_0_close

recording:
  episodes: 1
  max_steps: 120
  seed: 0
  policy: zero
  output_dir: data/episodes/sim/tennis_ball_place
  export_dir: data/exports/structured/sim/tennis_ball_place
  dataset_metadata:
    domain: sim
    source: digital_twin_maniskill
    sim_to_real_ready: false
    replay_target_domain: real
    action_content:
      raw_trace: hand_target_raw_count
      train_norm: hand_target_norm
      code_annotation: hand_code_id
    camera_calibration_id: sim_base_camera_v0
    workspace_twin_id: jaka_rh56_tabletop_tennis_ball_v0

logging:
  logging_config: configs/logging/default.yaml
