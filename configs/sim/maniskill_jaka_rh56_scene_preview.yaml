env:
  env_id: PickCubeJakaRH56-v1
  robot_uids: jaka_rh56
  agent_module: sim_maniskill.agents.jaka_rh56
  env_module: sim_maniskill.tasks.pick_cube_jaka_rh56
  obs_mode: rgbd
  control_mode: pd_joint_delta_pos
  render_mode: rgb_array
  sim_backend: physx_cpu
  num_envs: 1
  camera_uid: base_camera
  flatten_rgbd_obs: false
  sensor_configs:
    width: 256
    height: 256
  env_kwargs:
    start_pose: pregrasp

task:
  task_name: pick_and_place
  instruction: preview the JAKA mini2 and RH56 pick cube scene
  operator: sim_maniskill_scene_preview

robot:
  arm_joint_count: 6
  hand_joint_count: 6

recording:
  episodes: 1
  max_steps: 1
  seed: 0
  policy: zero
  output_dir: data/episodes/maniskill_jaka_rh56_scene_preview
  export_dir: data/exports/structured/maniskill_jaka_rh56_scene_preview

logging:
  logging_config: configs/logging/default.yaml
