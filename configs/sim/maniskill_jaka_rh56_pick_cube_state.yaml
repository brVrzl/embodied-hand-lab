env:
  env_id: PickCubeJakaRH56-v1
  robot_uids: jaka_rh56
  agent_module: sim_maniskill.agents.jaka_rh56
  env_module: sim_maniskill.tasks.pick_cube_jaka_rh56
  obs_mode: state
  control_mode: pd_joint_delta_pos
  render_mode: null
  render_backend: none
  sim_backend: physx_cpu
  num_envs: 1
  flatten_rgbd_obs: false
  env_kwargs:
    start_pose: pregrasp

task:
  task_name: pick_and_place
  instruction: pick the cube and place it at the goal region with jaka mini2 and rh56
  operator: sim_maniskill_jaka_rh56_state

robot:
  arm_joint_count: 6
  hand_joint_count: 6

recording:
  episodes: 1
  max_steps: 50
  seed: 0
  policy: random
  output_dir: data/episodes/maniskill_jaka_rh56_pick_cube_state
  export_dir: data/exports/structured/maniskill_jaka_rh56_pick_cube_state

logging:
  logging_config: configs/logging/default.yaml
