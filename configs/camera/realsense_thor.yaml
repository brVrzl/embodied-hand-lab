mode: real
device_type: rgbd
vendor: intel
model: realsense_d435
width: 848
height: 480
fps: 30
align_depth_to_color: true
visual_preset: default
warmup_frames: 5
timeout_ms: 5000
max_timestamp_skew_ms: 50.0
sync_retry_frames: 30
filters:
  # Stereo filtering is performed in disparity space. Runtime keeps temporal
  # and global hole filling off to avoid robot/object motion trails and edge leaks.
  use_disparity: true
  spatial:
    enabled: true
    magnitude: 2
    smooth_alpha: 0.5
    smooth_delta: 20
    hole_fill: 0
  temporal:
    enabled: false
    smooth_alpha: 0.4
    smooth_delta: 20
    persistence_control: 3
  hole_filling:
    enabled: false
    mode: 1
cameras:
  side:
    serial: "346222072985"
    usb_type: "3.2"
    firmware: "5.15.1.55"
    frame_id: camera_side_color_optical_frame
    frames:
      base: camera_side_link
      rgb_optical: camera_side_color_optical_frame
      depth_optical: camera_side_depth_optical_frame
    topics:
      rgb: /sensors/camera_side/color/image_raw
      depth: /sensors/camera_side/depth/image_raw
      camera_info: /sensors/camera_side/color/camera_info
  top:
    serial: "346522072675"
    usb_type: "3.2"
    firmware: "5.15.1.55"
    frame_id: camera_top_color_optical_frame
    frames:
      base: camera_top_link
      rgb_optical: camera_top_color_optical_frame
      depth_optical: camera_top_depth_optical_frame
    topics:
      rgb: /sensors/camera_top/color/image_raw
      depth: /sensors/camera_top/depth/image_raw
      camera_info: /sensors/camera_top/color/camera_info
