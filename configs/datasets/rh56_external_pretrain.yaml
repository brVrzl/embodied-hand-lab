schema_version: rh56_external_pretrain_v0.1
canonical_hand_order:
  - index
  - middle
  - ring
  - pinky
  - thumb_close
  - thumb_lateral

usage_policy:
  use_project_self_collected_data: false
  first_stage_goal: train_rh56_hand_state_prior
  second_stage_goal: train_grasp_conditioned_policy_after_sim_replay_filter
  notes:
    - External data is used before project self-collected episodes because current local data is small and not reliable enough for policy training.
    - Unitree Inspire datasets are used for hand command/state sequence priors, not for direct JAKA arm action cloning.
    - HRDexDB Inspire F1 is treated as target-domain robot-hand data, but hand joint order must be visually verified before direct command deployment.

datasets:
  - id: hahahataeyun/hrdexdb
    source: huggingface
    license: apache-2.0
    role: target_domain_grasp_sequences
    priority: primary
    robot_type: inspire_f1
    format: lerobot_v3
    fps: 30
    expected_scale:
      episodes: 507
      frames: 324423
    fields:
      observation_state: observation.state
      action: action
      image_keys:
        - observation.images.cam_25452066
        - observation.images.cam_23012641
        - observation.images.cam_23022639
    hand_mapping:
      state_slice: [15, 21]
      action_slice: [9, 15]
      order_status: verify_before_use
      assumed_order: canonical_hand_order
      source_range: raw_motor_units
      normalization: per_axis_minmax_after_visual_order_verification
    training_use:
      hand_vq: true
      hand_bc: true
      ee_relative_bc: true
      direct_jaka_joint_bc: false
      image_bc: later
    validation_gates:
      - Verify hand_joint_0..5 order against video on hrdexdb_test.
      - Replay extracted RH56 hand commands in MuJoCo and reject severe self-collision or object-through-hand artifacts.
      - Use only relative end-effector deltas; never clone xArm6 joint values to JAKA.

  - id: hahahataeyun/hrdexdb_test
    source: huggingface
    license: apache-2.0
    role: schema_and_visual_sanity_subset
    priority: smoke_test
    robot_type: inspire_f1
    format: lerobot_v3
    fps: 30
    expected_scale:
      episodes: 5
      frames: 2538
    fields:
      observation_state: observation.state
      action: action
      image_keys:
        - observation.images.cam_25452066
        - observation.images.cam_23012641
        - observation.images.cam_23022639
    hand_mapping:
      state_slice: [15, 21]
      action_slice: [9, 15]
      order_status: verify_before_use
      assumed_order: canonical_hand_order
      source_range: raw_motor_units
      normalization: per_axis_minmax_after_visual_order_verification
    training_use:
      hand_vq: false
      hand_bc: false
      ee_relative_bc: false
      direct_jaka_joint_bc: false
      image_bc: false

  - id: unitreerobotics/G1_WBT_Inspire_Pickup_Pillow_MainCamOnly
    source: huggingface
    license: apache-2.0
    role: inspire_hand_sequence_prior
    priority: primary_auxiliary
    robot_type: unitree_g1_inspire
    format: lerobot_v3
    fps: 30
    expected_scale:
      episodes: 609
      frames: 157060
    fields:
      observation_hand_state: observation.state.hand_state
      action_hand_cmd: action.hand_cmd
      image_keys:
        - observation.images.cam_0
        - observation.images.cam_1
    hand_mapping:
      source_order_per_hand: canonical_hand_order
      source_range: [0.0, 1.0]
      open_close_semantics: open_to_close
      side_strategy: infer_active_side_by_motion_energy
    training_use:
      hand_vq: true
