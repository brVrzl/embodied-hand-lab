hand_tracking_streamer:
  transport: udp
  port: 9000
  required_hand: right
  left_hand_required: false
  head_pose_required: false
  required_joint_count: 21
  stale_after_ms: 250

  # Offline canonical-operator preparation only; these are not robot bounds.
  translation_scale: [0.35, 0.35, 0.35]
  orientation_mapping: relative
  orientation_scale: 1.0
  filter_time_constant_ms: 20
  jump_reject_translation_m: 0.25
  jump_reject_rotation_deg: 45.0
  operator_workspace_min_m: [-0.20, -0.20, -0.20]
  operator_workspace_max_m: [0.20, 0.20, 0.20]
