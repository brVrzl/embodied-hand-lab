[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-lab"
version = "0.1.0"
description = "Real-world embodied intelligence lab bring-up stack"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "mujoco>=3.8.0",
  "pyserial>=3.5",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
data = [
  "huggingface_hub>=0.24",
  "pandas>=2.0",
  "pyarrow>=15.0",
]
vision-teleop = [
  "mediapipe>=0.10.35",
  "opencv-contrib-python>=4.13",
]
realsense = [
  "pyrealsense2>=2.55",
]
phone-teleop = [
  "hebi-py>=2.13",
]
motion-input-viz = [
  "matplotlib>=3.8",
]
teledex-teleop = [
  "teledex>=0.0.6,<0.1",
]
gamepad = [
  "pygame>=2.6",
]
sim = [
  "gymnasium>=1.0",
  "mani_skill>=3.0",
]
asset-tools = [
  "trimesh>=4.0",
  "coacd>=1.0",
  "scipy>=1.10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
